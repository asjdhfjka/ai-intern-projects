<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>工大智政 · AI 助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        #chat-box {
            width: 100%;
            max-width: 720px;
            height: 85vh;
            max-height: 850px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            padding: 18px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .header-subtitle {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .online-dot {
            width: 7px;
            height: 7px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ===== 消息区 ===== */
        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #f8f9fc;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .msg {
            margin-bottom: 20px;
            padding: 14px 18px;
            border-radius: 16px;
            max-width: 82%;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14.5px;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .bot {
            background: white;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        /* AI 消息里的 Markdown 样式 */
        .bot h3 { font-size: 15px; margin: 10px 0 8px; color: #334155; }
        .bot p { margin: 6px 0; }
        .bot ul, .bot ol { margin: 6px 0 6px 20px; }
        .bot li { margin: 3px 0; }
        .bot strong { color: #4f46e5; }
        .bot code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #db2777;
        }
        .bot a {
            color: #4f46e5;
            text-decoration: none;
            border-bottom: 1px dashed #4f46e5;
        }
        .bot a:hover { border-bottom-style: solid; }

        /* ===== 输入区 ===== */
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            outline: none;
            font-size: 14.5px;
            font-family: inherit;
            transition: all 0.2s;
            background: #f8f9fc;
        }
        #user-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:active:not(:disabled) { transform: translateY(0); }

        #send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        #send-btn:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        #send-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
            font-size: 18px;
        }
        .btn-upload {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-review {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* ===== 打字机光标 ===== */
        .typing-cursor::after {
            content: '▋';
            color: #667eea;
            animation: blink 1s infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== 来源列表 ===== */
        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #cbd5e1;
            font-size: 12.5px;
            line-height: 1.8;
        }
        .sources a {
            display: inline-block;
            margin-right: 8px;
            padding: 2px 8px;
            background: #eff6ff;
            border-radius: 6px;
            border-bottom: none;
            transition: all 0.2s;
        }
        .sources a:hover {
            background: #dbeafe;
            transform: translateX(2px);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body { padding: 0; }
            #chat-box {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            .msg { max-width: 90%; }
            .btn-secondary { width: 40px; height: 40px; }
            .header-title { font-size: 15px; }
        }

        /* ===== 加载动画 ===== */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="chat-box">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="header-left">
                <div class="header-icon">🎓</div>
                <div>
                    <div class="header-title">工大智政 · AI 助手</div>
                    <div class="header-subtitle">
                        <span class="online-dot"></span>
                        <span>在线 · 基于本地知识库</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="clearChat()" title="清空对话">🗑️</button>
            </div>
        </div>

        <!-- 消息区 -->
        <div id="messages">
            <div class="msg bot">你好！我是工大智政 AI 助手 👋<br>我可以帮你查询学校的通知公告，也可以审查材料。有什么可以帮你的？</div>
        </div>

        <!-- 输入区 -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="输入你的问题..." />
            <input type="file" id="file-upload" style="display: none;" onchange="uploadFile()" accept=".pdf,.txt,.docx,.png,.jpg,.jpeg,.doc">
            <button class="btn btn-secondary btn-upload" onclick="document.getElementById('file-upload').click()" title="上传文档">📎</button>
            <input type="file" id="review-upload" style="display: none;" onchange="reviewFile()" accept=".pdf,.txt,.docx,.png,.jpg,.jpeg,.doc">
            <button class="btn btn-secondary btn-review" onclick="document.getElementById('review-upload').click()" title="材料审查">📋</button>
            <button class="btn" id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        function clearChat() {
            document.getElementById('messages').innerHTML = `
                <div class="msg bot">你好！我是工大智政 AI 助手 👋<br>我可以帮你查询学校的通知公告，也可以审查材料。有什么可以帮你的？</div>
            `;
        }

        function createBotMsg(content = '') {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = content;
            return div;
        }

        // ============ 审查文件 ============
        async function reviewFile() {
            const fileInput = document.getElementById('review-upload');
            const file = fileInput.files[0];
            if (!file) return;

            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="msg user">正在审查文件：${file.name}...</div>`;
            messages.scrollTop = messages.scrollHeight;

            const formData = new FormData();
            formData.append('file', file);

            const reviewDiv = createBotMsg('<span class="loading-dots"><span></span><span></span><span></span></span> 正在多维度审查中...');
            messages.appendChild(reviewDiv);
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/review', { method: 'POST', body: formData });
                const data = await response.json();
                console.log("审查返回数据:", data);

                if (!data.review_result) {
                    reviewDiv.innerHTML = `❌ 审查失败：${data.error || '返回数据异常'}`;
                    return;
                }

                const r = data.review_result;

                if (typeof r === 'string') {
                    reviewDiv.innerHTML = marked.parse(r);
                    return;
                }

                let html = `<h3 style="margin:0 0 12px 0;">📋 审查报告</h3>`;

                const gradeColor = {
                    '优秀': 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                    '合格': 'linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)',
                    '需修改': 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
                    '不合格': 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)'
                }[r.等级] || 'linear-gradient(135deg, #6b7280 0%, #4b5563 100%)';

                html += `<div style="background:${gradeColor}; color:white; padding:18px; border-radius:12px; margin-bottom:15px; text-align:center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                    <div style="font-size:38px; font-weight:bold; letter-spacing:-1px;">${r.总评分}<span style="font-size:16px; opacity:0.8;">/100</span></div>
                    <div style="font-size:13px; margin-top:6px; opacity:0.95;">等级：${r.等级} · 材料类型：${r.材料类型 || '通用'}</div>
                </div>`;

                if (r.硬规则校验 && r.硬规则校验.length > 0) {
                    const errorRules = r.硬规则校验.filter(x => !x.passed && !x.not_applicable && x.severity === 'error');
                    const warningRules = r.硬规则校验.filter(x => !x.passed && !x.not_applicable && x.severity === 'warning');
                    const passedRules = r.硬规则校验.filter(x => x.passed);
                    const naRules = r.硬规则校验.filter(x => x.not_applicable);

                    html += `<div style="margin-bottom:10px; font-size:13px; color:#64748b; padding:8px 12px; background:#f1f5f9; border-radius:8px;">
                        ⚙️ 硬规则（${r.硬规则得分}/100）：❌ ${errorRules.length} · ⚠️ ${warningRules.length} · ✅ ${passedRules.length} · ➖ ${naRules.length}
                    </div>`;

                    errorRules.forEach(rule => {
                        html += `<div style="padding:10px 14px; margin:6px 0; background:#fef2f2; border-left:4px solid #ef4444; border-radius:6px; font-size:13px;">
                            <b style="color:#dc2626;">❌ ${rule.rule_name}</b>
                            <div style="color:#991b1b; margin-top:4px;">→ ${rule.message}</div>
                        </div>`;
                    });

                    warningRules.forEach(rule => {
                        html += `<div style="padding:10px 14px; margin:6px 0; background:#fffbeb; border-left:4px solid #f59e0b; border-radius:6px; font-size:13px;">
                            <b style="color:#d97706;">⚠️ ${rule.rule_name}</b>
                            <div style="color:#92400e; margin-top:4px;">→ ${rule.message}</div>
                        </div>`;
                    });

                    if (passedRules.length > 0) {
                        html += `<details style="margin-top:10px; font-size:12.5px;">
                            <summary style="cursor:pointer; color:#059669; font-weight:500; padding:6px;">✅ 已通过的规则（${passedRules.length} 项，点击展开）</summary>
                            <div style="margin-top:5px;">
                                ${passedRules.map(x => `<div style="padding:3px 10px; color:#64748b;">✓ ${x.rule_name}</div>`).join('')}
                            </div>
                        </details>`;
                    }
                }

                if (r.软审查) {
                    html += `<div style="margin-top:15px; font-size:14px;"><b>🧠 软审查</b></div>`;

                    if (r.软审查.表述规范性) {
                        const score = r.软审查.表述规范性.评分;
                        const color = score >= 80 ? '#10b981' : score >= 60 ? '#f59e0b' : '#ef4444';
                        html += `<div style="padding:10px 14px; margin:6px 0; background:#f8fafc; border-radius:8px; font-size:13px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <b>表述规范性</b>
                                <span style="color:${color}; font-weight:bold;">${score}/100</span>
                            </div>
                            ${r.软审查.表述规范性.问题 && r.软审查.表述规范性.问题.length
                                ? `<ul style="margin:6px 0 0 20px; padding:0; color:#64748b;">${r.软审查.表述规范性.问题.map(p => `<li>${p}</li>`).join('')}</ul>`
                                : '<div style="color:#10b981; margin-top:4px;">✓ 无问题</div>'}
                        </div>`;
                    }

                    if (r.软审查.逻辑一致性) {
                        const score = r.软审查.逻辑一致性.评分;
                        const color = score >= 80 ? '#10b981' : score >= 60 ? '#f59e0b' : '#ef4444';
                        html += `<div style="padding:10px 14px; margin:6px 0; background:#f8fafc; border-radius:8px; font-size:13px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <b>逻辑一致性</b>
                                <span style="color:${color}; font-weight:bold;">${score}/100</span>
                            </div>
                            ${r.软审查.逻辑一致性.问题 && r.软审查.逻辑一致性.问题.length
                                ? `<ul style="margin:6px 0 0 20px; padding:0; color:#64748b;">${r.软审查.逻辑一致性.问题.map(p => `<li>${p}</li>`).join('')}</ul>`
                                : '<div style="color:#10b981; margin-top:4px;">✓ 无问题</div>'}
                        </div>`;
                    }
                }

                reviewDiv.innerHTML = html;

            } catch (error) {
                console.error("审查错误:", error);
                reviewDiv.innerHTML = '❌ 审查失败，请重试。';
            } finally {
                fileInput.value = '';
                messages.scrollTop = messages.scrollHeight;
            }
        }

        // ============ 上传文件 ============
        async function uploadFile() {
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            if (!file) return;

            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="msg user">正在上传文件：${file.name}...</div>`;
            messages.scrollTop = messages.scrollHeight;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                messages.innerHTML += `<div class="msg bot">${marked.parse(data.message || data.error)}</div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch (error) {
                messages.innerHTML += `<div class="msg bot">上传失败，请重试。</div>`;
            } finally {
                fileInput.value = '';
            }
        }

        // ============ 发送消息（流式） ============
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const messages = document.getElementById('messages');
            const text = input.value.trim();
            if (!text) return;

            messages.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中';

            const botMsgDiv = createBotMsg('<span class="loading-dots"><span></span><span></span><span></span></span> 正在检索知识库...');
            botMsgDiv.classList.add('typing-cursor');
            messages.appendChild(botMsgDiv);
            messages.scrollTop = messages.scrollHeight;

            let sourcesData = [];
            let buffer = '';
            let accumulatedText = '';
            let isParsedSources = false;

            try {
                const allMessages = Array.from(document.querySelectorAll('.msg'))
                    .filter(m => !m.innerText.includes('思考中') && !m.innerText.includes('正在检索'))
                    .slice(-4);
                const chatHistory = allMessages.map(m => {
                    let t = m.innerText;
                    if (t.includes('📎 参考来源')) t = t.split('📎 参考来源')[0];
                    if (t.includes('📎 检索到的相关材料')) t = t.split('📎 检索到的相关材料')[0];
                    if (t.includes('您可以参考下方我为您检索到的相关材料')) t = t.split('您可以参考下方我为您检索到的相关材料')[0];
                    return t.substring(0, 200);
                }).join('\n---\n');

                const response = await fetch(`/chat/stream?user_input=${encodeURIComponent(text)}&history=${encodeURIComponent(chatHistory)}`, {
                    method: 'POST'
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                botMsgDiv.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk;

                    if (!isParsedSources) {
                        if (buffer.includes('__END__')) {
                            const startIdx = buffer.indexOf('__SOURCES__') + 11;
                            const endIdx = buffer.indexOf('__END__');
                            try {
                                sourcesData = JSON.parse(buffer.slice(startIdx, endIdx));
                                buffer = buffer.slice(endIdx + 7);
                            } catch (e) { console.error("解析来源失败", e); }
                            isParsedSources = true;
                        } else if (buffer.includes('__SOURCES__')) {
                            continue;
                        } else {
                            isParsedSources = true;
                        }
                    }

                    if (buffer) {
                        accumulatedText += buffer;

                        let renderedText = accumulatedText.replace(/\[来源(\d+)\]/g, (match, num) => {
                            const source = sourcesData[parseInt(num) - 1];
                            if (source && source.url) {
                                return `<a href="${source.url}" target="_blank">[来源${num}]</a>`;
                            }
                            return match;
                        });

                        if (renderedText.trim()) {
                            botMsgDiv.innerHTML = marked.parse(renderedText);
                        }

                        if (messages.scrollHeight - messages.scrollTop - messages.clientHeight < 100) {
                            messages.scrollTop = messages.scrollHeight;
                        }
                        buffer = '';
                    }
                }

                if (buffer) {
                    accumulatedText += buffer;
                    let renderedText = accumulatedText.replace(/\[来源(\d+)\]/g, (match, num) => {
                        const source = sourcesData[parseInt(num) - 1];
                        if (source && source.url) {
                            return `<a href="${source.url}" target="_blank">[来源${num}]</a>`;
                        }
                        return match;
                    });
                    if (renderedText.trim()) {
                        botMsgDiv.innerHTML = marked.parse(renderedText);
                    }
                }

                botMsgDiv.classList.remove('typing-cursor');

                if (sourcesData.length > 0) {
                    const usedSourceIndices = new Set();
                    const matches = accumulatedText.matchAll(/\[来源(\d+)\]/g);
                    for (const match of matches) {
                        usedSourceIndices.add(parseInt(match[1]));
                    }

                    let finalSources = sourcesData.filter(s => usedSourceIndices.has(s.index));
                    if (finalSources.length === 0) {
                        finalSources = sourcesData.slice(0, 3);
                    }

                    const sourcesDiv = document.createElement('div');
                    sourcesDiv.className = 'sources';
                    sourcesDiv.innerHTML = '<b>📎 参考来源：</b><br>' +
                    finalSources.map(s => {
                        const isLocalFile = s.url.startsWith('/preview/');
                        const icon = isLocalFile ? '📄' : '🔗';
                        let finalUrl = s.url;
                        if (isLocalFile) {
                            const fileName = s.url.replace('/preview/', '');
                            finalUrl = `/preview/${encodeURIComponent(fileName)}`;
                        }
                        return `<a href="${finalUrl}" target="_blank">${icon} [来源${s.index}] ${s.title}</a>`;
                    }).join('<br>');
                    botMsgDiv.appendChild(sourcesDiv);
                }

            } catch (error) {
                console.error("流式读取错误:", error);
                botMsgDiv.classList.remove('typing-cursor');
                botMsgDiv.innerText = '网络错误或连接被代理拦截，请稍后重试。';
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = '发送';
                input.focus();
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
